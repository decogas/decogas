# Despliegue automático a Nicalia (hosting cPanel) por FTP en cada push a main.
# Construye web/ (Astro) y sincroniza web/dist a la carpeta decogas.es del hosting.
# Requiere 3 secrets en el repo (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    -> 92.60.33.97
#   FTP_USERNAME  -> decogas@decogas.es
#   FTP_PASSWORD  -> (la contraseña del FTP)
name: Desplegar en Nicalia (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild semanal (lunes 05:30 UTC) para que las fichas de producto
    # generadas desde Supabase no se queden desfasadas sin pushes.
    - cron: '30 5 * * 1'

concurrency:
  group: deploy-nicalia
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Ejecutar tests (node:test, sin dependencias)
        run: npm test
      - name: Instalar dependencias
        run: npm ci
        working-directory: web
      - name: Construir el sitio (Astro)
        run: npm run build
        working-directory: web
        env:
          SITE: https://decogas.es
          BASE: /
      - name: Desplegar por FTP a Nicalia
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./web/dist/
          server-dir: /decogas.es/
          exclude: |
            **/.git*
            **/.git*/**
            **/.ftp-deploy-sync-state.json
